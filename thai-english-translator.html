<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0e17" />
  <meta name="description" content="Fast Thai ↔ English speech translator. Speak and get instant spoken translation." />
  <title>Thai ↔ English Translator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #070b14;
      --surface: rgba(22, 30, 48, 0.78);
      --surface-solid: #121a2b;
      --surface-2: #1a2438;
      --border: rgba(255,255,255,0.08);
      --border-strong: rgba(255,255,255,0.14);
      --text: #f0f4fc;
      --text-muted: #8b9cb8;
      --accent: #3b82f6;
      --accent-2: #60a5fa;
      --thai: #f97316;
      --success: #22c55e;
      --warning: #eab308;
      --danger: #ef4444;
      --radius: 18px;
      --shadow: 0 12px 40px rgba(0,0,0,0.45);
      --glass: blur(20px) saturate(1.4);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      font-family: 'Inter', 'Noto Sans Thai', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(ellipse 80% 50% at 20% -10%, rgba(59,130,246,0.18), transparent 50%),
        radial-gradient(ellipse 70% 40% at 90% 10%, rgba(249,115,22,0.12), transparent 45%),
        radial-gradient(ellipse 60% 30% at 50% 100%, rgba(59,130,246,0.08), transparent 40%),
        var(--bg);
    }
    .app {
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      padding: 16px 14px 28px;
      padding-bottom: max(28px, env(safe-area-inset-bottom));
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: relative;
      z-index: 1;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 2px 2px;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .logo {
      width: 40px; height: 40px; border-radius: 12px;
      background: linear-gradient(135deg, #3b82f6, #f97316);
      display: grid; place-items: center; font-size: 1.15rem;
      box-shadow: 0 4px 16px rgba(59,130,246,0.35);
    }
    .brand h1 {
      font-size: 1.15rem; font-weight: 700;
      letter-spacing: -0.03em; line-height: 1.2;
    }
    .brand span { font-size: 0.72rem; color: var(--text-muted); font-weight: 500; }
    .header-actions { display: flex; gap: 6px; }
    .icon-btn {
      width: 38px; height: 38px; border: 1px solid var(--border);
      border-radius: 11px; background: var(--surface);
      backdrop-filter: var(--glass); color: var(--text-muted);
      cursor: pointer; display: grid; place-items: center;
      transition: all 0.18s ease;
    }
    .icon-btn:hover {
      color: var(--text); border-color: var(--border-strong);
      background: var(--surface-2);
    }
    .icon-btn:active { transform: scale(0.94); }
    .icon-btn.active {
      color: var(--accent-2); border-color: rgba(59,130,246,0.4);
      background: rgba(59,130,246,0.12);
    }
    .mode-bar {
      display: flex; align-items: center; gap: 8px;
      background: var(--surface); backdrop-filter: var(--glass);
      border: 1px solid var(--border); border-radius: 14px; padding: 5px;
    }
    .mode-btn {
      flex: 1; padding: 11px 6px; border: none; border-radius: 10px;
      background: transparent; color: var(--text-muted);
      font-family: inherit; font-size: 0.88rem; font-weight: 600;
      cursor: pointer; transition: all 0.2s ease;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .mode-btn.active.en {
      background: linear-gradient(135deg, rgba(59,130,246,0.28), rgba(59,130,246,0.1));
      color: #93c5fd; box-shadow: 0 2px 10px rgba(59,130,246,0.15);
    }
    .mode-btn.active.th {
      background: linear-gradient(135deg, rgba(249,115,22,0.28), rgba(249,115,22,0.1));
      color: #fdba74; box-shadow: 0 2px 10px rgba(249,115,22,0.15);
    }
    .mode-btn:hover:not(.active) {
      color: var(--text); background: rgba(255,255,255,0.04);
    }
    .swap-btn {
      width: 36px; height: 36px; flex-shrink: 0;
      border: 1px solid var(--border); border-radius: 10px;
      background: var(--surface-2); color: var(--text-muted);
      cursor: pointer; display: grid; place-items: center; transition: all 0.2s;
    }
    .swap-btn:hover {
      color: var(--text); transform: rotate(180deg); border-color: var(--border-strong);
    }
    .status {
      display: flex; align-items: center; justify-content: center; gap: 9px;
      padding: 9px 14px; background: var(--surface); backdrop-filter: var(--glass);
      border: 1px solid var(--border); border-radius: 12px;
      font-size: 0.82rem; color: var(--text-muted); min-height: 40px;
      transition: all 0.25s;
    }
    .status-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--text-muted); flex-shrink: 0; transition: all 0.3s;
    }
    .status-dot.on { background: var(--success); box-shadow: 0 0 8px var(--success); animation: pulse 1.3s ease infinite; }
    .status-dot.busy { background: var(--warning); animation: pulse 0.9s ease infinite; }
    .status-dot.speak { background: var(--accent); animation: pulse 1s ease infinite; }
    .status-dot.err { background: var(--danger); }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(1.25); }
    }
    .cards { display: flex; flex-direction: column; gap: 12px; flex: 1; }
    .card {
      background: var(--surface); backdrop-filter: var(--glass);
      border: 1px solid var(--border); border-radius: var(--radius);
      padding: 14px 16px 12px; box-shadow: var(--shadow);
      transition: border-color 0.2s, box-shadow 0.2s; position: relative; overflow: hidden;
    }
    .card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0; transition: opacity 0.3s;
    }
    .card.active-source::before { opacity: 0.7; }
    .card-top {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;
    }
    .card-label {
      font-size: 0.7rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.07em; color: var(--text-muted);
      display: flex; align-items: center; gap: 6px;
    }
    .card-actions { display: flex; gap: 4px; }
    .card-actions .icon-btn {
      width: 30px; height: 30px; border-radius: 8px;
      background: transparent; border: none;
    }
    .card-actions .icon-btn:hover { background: rgba(255,255,255,0.06); }
    textarea {
      width: 100%; min-height: 78px; max-height: 160px;
      background: transparent; border: none; outline: none;
      color: var(--text); font-family: inherit; font-size: 1.12rem;
      line-height: 1.55; resize: none; overflow-y: auto;
    }
    textarea::placeholder { color: var(--text-muted); opacity: 0.55; }
    .card.thai textarea {
      font-family: 'Noto Sans Thai', 'Inter', sans-serif; font-size: 1.22rem;
    }
    .card-footer {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 6px; min-height: 22px;
    }
    .char-count { font-size: 0.7rem; color: var(--text-muted); opacity: 0.7; }
    .interim-tag {
      font-size: 0.68rem; color: var(--accent-2);
      background: rgba(59,130,246,0.12); padding: 2px 8px;
      border-radius: 6px; opacity: 0; transition: opacity 0.2s;
    }
    .interim-tag.show { opacity: 1; }
    .mic-zone {
      display: flex; flex-direction: column; align-items: center;
      gap: 12px; padding: 6px 0 4px;
    }
    .mic-ring-wrap { position: relative; width: 92px; height: 92px; }
    .mic-btn {
      width: 92px; height: 92px; border-radius: 50%; border: none;
      background: linear-gradient(145deg, #3b82f6 0%, #1d4ed8 100%);
      color: #fff; cursor: pointer; display: grid; place-items: center;
      position: relative; z-index: 2;
      box-shadow: 0 8px 28px rgba(59,130,246,0.4), inset 0 1px 0 rgba(255,255,255,0.15);
      transition: transform 0.2s, box-shadow 0.2s, background 0.25s;
    }
    .mic-btn:hover { transform: scale(1.04); }
    .mic-btn:active { transform: scale(0.96); }
    .mic-btn.th-mode {
      background: linear-gradient(145deg, #f97316 0%, #c2410c 100%);
      box-shadow: 0 8px 28px rgba(249,115,22,0.4), inset 0 1px 0 rgba(255,255,255,0.12);
    }
    .mic-btn.listening {
      background: linear-gradient(145deg, #ef4444 0%, #b91c1c 100%);
      box-shadow: 0 8px 28px rgba(239,68,68,0.45);
      animation: micGlow 1.6s ease infinite;
    }
    @keyframes micGlow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.45), 0 8px 28px rgba(239,68,68,0.35); }
      50% { box-shadow: 0 0 0 14px rgba(239,68,68,0), 0 8px 28px rgba(239,68,68,0.35); }
    }
    .rings { position: absolute; inset: 0; pointer-events: none; }
    .rings i {
      position: absolute; inset: 0; border-radius: 50%;
      border: 2px solid rgba(239,68,68,0.35); opacity: 0;
    }
    .mic-btn.listening ~ .rings i { animation: expandRing 1.6s ease-out infinite; }
    .mic-btn.listening ~ .rings i:nth-child(2) { animation-delay: 0.45s; }
    @keyframes expandRing {
      0% { transform: scale(1); opacity: 0.55; }
      100% { transform: scale(1.85); opacity: 0; }
    }
    .mic-label {
      font-size: 0.82rem; color: var(--text-muted);
      text-align: center; min-height: 1.2em;
    }
    .actions {
      display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
    }
    .btn {
      padding: 10px 16px; border-radius: 12px; border: 1px solid var(--border);
      background: var(--surface); backdrop-filter: var(--glass);
      color: var(--text); font-family: inherit; font-size: 0.86rem;
      font-weight: 550; cursor: pointer; display: inline-flex;
      align-items: center; gap: 7px; transition: all 0.15s;
    }
    .btn:hover { background: var(--surface-2); border-color: var(--border-strong); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; pointer-events: none; }
    .btn.primary {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      border: none; color: #fff; box-shadow: 0 4px 14px rgba(59,130,246,0.3);
    }
    .btn.primary:hover { filter: brightness(1.08); }
    .btn.primary.th {
      background: linear-gradient(135deg, #f97316, #ea580c);
      box-shadow: 0 4px 14px rgba(249,115,22,0.3);
    }
    .panel {
      display: none; background: var(--surface); backdrop-filter: var(--glass);
      border: 1px solid var(--border); border-radius: var(--radius);
      padding: 16px; animation: fadeUp 0.25s ease;
    }
    .panel.open { display: block; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .panel h3 {
      font-size: 0.8rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--text-muted); margin-bottom: 12px;
    }
    .setting-row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border);
    }
    .setting-row:last-child { border-bottom: none; }
    .setting-row label { font-size: 0.9rem; font-weight: 500; }
    .setting-row select, .setting-row input[type="range"] {
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-family: inherit;
      font-size: 0.85rem; padding: 6px 10px; max-width: 160px;
    }
    .setting-row input[type="range"] {
      width: 110px; padding: 0; accent-color: var(--accent);
    }
    .toggle {
      width: 44px; height: 24px; border-radius: 12px;
      background: var(--surface-2); border: 1px solid var(--border);
      position: relative; cursor: pointer; transition: background 0.2s;
    }
    .toggle.on { background: var(--accent); border-color: var(--accent); }
    .toggle::after {
      content: ''; position: absolute; top: 2px; left: 2px;
      width: 18px; height: 18px; border-radius: 50%; background: #fff;
      transition: transform 0.2s;
    }
    .toggle.on::after { transform: translateX(20px); }
    .history-wrap { margin-top: 2px; }
    .history-head {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;
    }
    .history-head h3 {
      font-size: 0.75rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--text-muted);
    }
    .history-list {
      display: flex; flex-direction: column; gap: 7px;
      max-height: 200px; overflow-y: auto; scroll-behavior: smooth;
    }
    .hist-item {
      background: var(--surface); backdrop-filter: var(--glass);
      border: 1px solid var(--border); border-radius: 12px;
      padding: 11px 13px; cursor: pointer;
      transition: background 0.15s, border-color 0.15s; animation: fadeUp 0.3s ease;
    }
    .hist-item:hover { background: var(--surface-2); border-color: var(--border-strong); }
    .hist-item .h-orig {
      font-size: 0.82rem; color: var(--text-muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 3px;
    }
    .hist-item .h-trans {
      font-size: 0.95rem; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .empty {
      text-align: center; color: var(--text-muted); font-size: 0.85rem;
      padding: 18px 10px; opacity: 0.7;
    }
    .toast {
      position: fixed; bottom: max(24px, env(safe-area-inset-bottom));
      left: 50%; transform: translateX(-50%) translateY(120%);
      background: var(--surface-solid); color: var(--text);
      padding: 11px 18px; border-radius: 12px;
      border: 1px solid var(--border-strong); font-size: 0.88rem;
      box-shadow: var(--shadow); z-index: 200; opacity: 0;
      transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none; max-width: 90vw; text-align: center;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 3px; }
    @media (max-width: 420px) {
      .app { padding: 12px 10px 24px; gap: 12px; }
      .brand h1 { font-size: 1.05rem; }
      .mode-btn { font-size: 0.8rem; padding: 10px 4px; }
      .mic-ring-wrap, .mic-btn { width: 84px; height: 84px; }
      textarea { font-size: 1.05rem; min-height: 70px; }
      .card.thai textarea { font-size: 1.12rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="logo">🗣️</div>
        <div>
          <h1>Thai ↔ English</h1>
          <span>Instant speech translation</span>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="settingsBtn" title="Settings" aria-label="Settings" onclick="toggleSettings()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        </button>
      </div>
    </header>

    <div class="mode-bar">
      <button class="mode-btn en active" id="btnEnTh" onclick="setMode('en-th')">🇬🇧 EN → TH</button>
      <button class="swap-btn" onclick="swapMode()" title="Swap languages" aria-label="Swap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M7 16V4M7 4L3 8M7 4l4 4M17 8v12M17 20l4-4M17 20l-4-4"/></svg>
      </button>
      <button class="mode-btn th" id="btnThEn" onclick="setMode('th-en')">🇹🇭 TH → EN</button>
    </div>

    <div class="status" id="statusBar">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Ready — tap mic to speak</span>
    </div>

    <div class="panel" id="settingsPanel">
      <h3>Settings</h3>
      <div class="setting-row">
        <label>Auto-speak translation</label>
        <div class="toggle on" id="toggleAutoSpeak" onclick="toggleSetting('autoSpeak')"></div>
      </div>
      <div class="setting-row">
        <label>Continuous listening</label>
        <div class="toggle on" id="toggleContinuous" onclick="toggleSetting('continuous')"></div>
      </div>
      <div class="setting-row">
        <label>Speech rate</label>
        <input type="range" id="rateSlider" min="0.7" max="1.4" step="0.05" value="1" oninput="settings.rate = +this.value" />
      </div>
      <div class="setting-row">
        <label>Voice (English)</label>
        <select id="voiceEn" onchange="settings.voiceEn = this.value"></select>
      </div>
      <div class="setting-row">
        <label>Voice (Thai)</label>
        <select id="voiceTh" onchange="settings.voiceTh = this.value"></select>
      </div>
    </div>

    <div class="cards">
      <div class="card" id="sourceCard">
        <div class="card-top">
          <span class="card-label" id="sourceLabel">🇬🇧 English · you speak</span>
          <div class="card-actions">
            <button class="icon-btn" title="Clear" onclick="clearAll()" aria-label="Clear">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
            </button>
          </div>
        </div>
        <textarea id="sourceText" placeholder="Speak or type here..." rows="3"></textarea>
        <div class="card-footer">
          <span class="char-count" id="sourceCount"></span>
          <span class="interim-tag" id="interimTag">listening…</span>
        </div>
      </div>

      <div class="card thai" id="targetCard">
        <div class="card-top">
          <span class="card-label" id="targetLabel">🇹🇭 Thai · translation</span>
          <div class="card-actions">
            <button class="icon-btn" title="Copy" onclick="copyTarget()" aria-label="Copy">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
            </button>
            <button class="icon-btn" title="Speak" onclick="speakTarget()" aria-label="Speak">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/></svg>
            </button>
          </div>
        </div>
        <textarea id="targetText" placeholder="Translation appears here…" rows="3" readonly></textarea>
        <div class="card-footer">
          <span class="char-count" id="targetCount"></span>
        </div>
      </div>
    </div>

    <div class="mic-zone">
      <div class="mic-ring-wrap">
        <button class="mic-btn" id="micBtn" onclick="toggleMic()" aria-label="Toggle microphone">
          <svg id="micIcon" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/>
            <path d="M19 10v2a7 7 0 01-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
        </button>
        <div class="rings"><i></i><i></i></div>
      </div>
      <p class="mic-label" id="micLabel">Tap to speak in English</p>
    </div>

    <div class="actions">
      <button class="btn" onclick="doTranslate()" id="translateBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 8l6 6M4 14l6-6 2 2"/><path d="M12 20h9"/><path d="M16 4h4v4"/><path d="M14 10l6-6"/></svg>
        Translate
      </button>
      <button class="btn primary" id="speakBtn" onclick="speakTarget()" disabled>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/></svg>
        Speak
      </button>
    </div>

    <div class="history-wrap">
      <div class="history-head">
        <h3>Recent</h3>
        <button class="icon-btn" style="width:28px;height:28px" title="Clear history" onclick="clearHistory()" aria-label="Clear history">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
        </button>
      </div>
      <div class="history-list" id="historyList">
        <div class="empty">No translations yet</div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const settings = {
      autoSpeak: true,
      continuous: true,
      rate: 1.0,
      voiceEn: '',
      voiceTh: ''
    };
    try {
      const saved = JSON.parse(localStorage.getItem('te_settings') || '{}');
      Object.assign(settings, saved);
    } catch {}

    let mode = 'en-th';
    let listening = false;
    let recognition = null;
    let finalBuffer = '';
    let translateTimer = null;
    let history = [];
    try { history = JSON.parse(localStorage.getItem('te_history') || '[]'); } catch {}
    let translating = false;
    let speaking = false;
    let lastTranslated = '';

    const $ = (id) => document.getElementById(id);
    const sourceText = $('sourceText');
    const targetText = $('targetText');
    const statusDot = $('statusDot');
    const statusText = $('statusText');
    const micBtn = $('micBtn');
    const micLabel = $('micLabel');
    const speakBtn = $('speakBtn');
    const interimTag = $('interimTag');
    const sourceCard = $('sourceCard');
    const targetCard = $('targetCard');

    function initRecognition() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) {
        setStatus('err', 'Speech recognition needs Chrome or Edge');
        micBtn.disabled = true;
        return;
      }
      recognition = new SR();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        listening = true;
        updateMicUI(true);
        sourceCard.classList.add('active-source');
        setStatus('on', mode === 'en-th' ? 'Listening (English)…' : 'กำลังฟัง (ไทย)…');
      };

      recognition.onresult = (ev) => {
        let interim = '';
        let finalChunk = '';
        for (let i = ev.resultIndex; i < ev.results.length; i++) {
          const t = ev.results[i][0].transcript;
          if (ev.results[i].isFinal) finalChunk += t;
          else interim += t;
        }
        if (finalChunk) {
          finalBuffer = (finalBuffer ? finalBuffer + ' ' : '') + finalChunk.trim();
          sourceText.value = finalBuffer;
          interimTag.classList.remove('show');
          updateCounts();
          scheduleTranslate(finalBuffer);
        } else if (interim) {
          sourceText.value = (finalBuffer ? finalBuffer + ' ' : '') + interim;
          interimTag.classList.add('show');
          updateCounts();
        }
      };

      recognition.onerror = (ev) => {
        if (ev.error === 'no-speech' || ev.error === 'aborted') return;
        if (ev.error === 'not-allowed') {
          setStatus('err', 'Microphone blocked — allow access in browser settings');
          stopMic();
          return;
        }
        console.warn('Speech error:', ev.error);
        if (ev.error === 'network') setStatus('err', 'Network error — check connection');
      };

      recognition.onend = () => {
        if (listening && settings.continuous) {
          try { recognition.start(); } catch { stopMic(); }
        } else {
          listening = false;
          updateMicUI(false);
          sourceCard.classList.remove('active-source');
          interimTag.classList.remove('show');
          if (!speaking && !translating) setStatus('', 'Ready — tap mic to speak');
        }
      };
    }

    function startMic() {
      if (!recognition) return;
      finalBuffer = sourceText.value.trim();
      recognition.lang = mode === 'en-th' ? 'en-US' : 'th-TH';
      try { recognition.start(); }
      catch (e) {
        console.error(e);
        setStatus('err', 'Could not start microphone');
      }
    }

    function stopMic() {
      listening = false;
      if (recognition) { try { recognition.stop(); } catch {} }
      updateMicUI(false);
      sourceCard.classList.remove('active-source');
      interimTag.classList.remove('show');
      if (!speaking && !translating) setStatus('', 'Ready — tap mic to speak');
    }

    function toggleMic() {
      if (listening) stopMic();
      else startMic();
    }

    function updateMicUI(on) {
      micBtn.classList.toggle('listening', on);
      micLabel.textContent = on
        ? (mode === 'en-th' ? 'Listening… tap to stop' : 'กำลังฟัง… แตะเพื่อหยุด')
        : (mode === 'en-th' ? 'Tap to speak in English' : 'แตะเพื่อพูดภาษาไทย');
    }

    async function translateGoogle(text, from, to) {
      const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${from}&tl=${to}&dt=t&q=${encodeURIComponent(text)}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('gtx ' + res.status);
      const data = await res.json();
      if (!Array.isArray(data) || !data[0]) throw new Error('bad response');
      return data[0].map(row => row[0]).filter(Boolean).join('');
    }

    async function translateMyMemory(text, from, to) {
      const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${from}|${to}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('mymemory ' + res.status);
      const data = await res.json();
      const out = data?.responseData?.translatedText;
      if (!out) throw new Error('empty');
      return out;
    }

    async function translate(text, from, to) {
      const key = from + '|' + to + '|' + text;
      if (window.__teCache && window.__teCache[key]) return window.__teCache[key];
      let result;
      try {
        result = await translateGoogle(text, from, to);
      } catch (e1) {
        console.warn('Google translate failed, trying MyMemory', e1);
        result = await translateMyMemory(text, from, to);
      }
      if (!window.__teCache) window.__teCache = {};
      window.__teCache[key] = result;
      const keys = Object.keys(window.__teCache);
      if (keys.length > 80) delete window.__teCache[keys[0]];
      return result;
    }

    function scheduleTranslate(text) {
      clearTimeout(translateTimer);
      translateTimer = setTimeout(() => runTranslate(text), 320);
    }

    async function runTranslate(text) {
      text = (text || sourceText.value || '').trim();
      if (!text || text === lastTranslated) return;
      const from = mode === 'en-th' ? 'en' : 'th';
      const to = mode === 'en-th' ? 'th' : 'en';
      translating = true;
      setStatus('busy', 'Translating…');
      try {
        const out = await translate(text, from, to);
        targetText.value = out;
        lastTranslated = text;
        speakBtn.disabled = !out;
        updateCounts();
        addHistory(text, out);
        if (settings.autoSpeak && out) {
          speakText(out, to === 'th' ? 'th-TH' : 'en-US');
        } else {
          translating = false;
          if (listening) setStatus('on', mode === 'en-th' ? 'Listening (English)…' : 'กำลังฟัง (ไทย)…');
          else setStatus('', 'Ready — tap mic to speak');
        }
      } catch (err) {
        console.error(err);
        translating = false;
        setStatus('err', 'Translation failed — try again');
        toast('Translation error. Check your connection.');
      }
    }

    function doTranslate() {
      const t = sourceText.value.trim();
      if (!t) { toast('Type or speak something first'); return; }
      lastTranslated = '';
      runTranslate(t);
    }

    function getVoices() {
      return window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
    }

    function pickVoice(langCode) {
      const voices = getVoices();
      const pref = langCode.startsWith('th') ? settings.voiceTh : settings.voiceEn;
      if (pref) {
        const v = voices.find(x => x.name === pref);
        if (v) return v;
      }
      const candidates = voices.filter(v => v.lang.toLowerCase().startsWith(langCode.split('-')[0]));
      return (
        candidates.find(v => /google/i.test(v.name)) ||
        candidates.find(v => /microsoft/i.test(v.name)) ||
        candidates.find(v => v.localService) ||
        candidates[0] || null
      );
    }

    function speakText(text, lang) {
      if (!text || !window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      speaking = true;
      setStatus('speak', mode === 'en-th' ? 'Speaking Thai…' : 'Speaking English…');
      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang;
      u.rate = settings.rate || 1;
      u.pitch = 1;
      const voice = pickVoice(lang);
      if (voice) u.voice = voice;
      u.onend = () => {
        speaking = false;
        translating = false;
        if (listening) setStatus('on', mode === 'en-th' ? 'Listening (English)…' : 'กำลังฟัง (ไทย)…');
        else setStatus('', 'Ready — tap mic to speak');
      };
      u.onerror = () => {
        speaking = false;
        translating = false;
        setStatus('', 'Ready — tap mic to speak');
      };
      window.speechSynthesis.speak(u);
    }

    function speakTarget() {
      const t = targetText.value.trim();
      if (!t) return;
      speakText(t, mode === 'en-th' ? 'th-TH' : 'en-US');
    }

    function setMode(m) {
      if (listening) stopMic();
      window.speechSynthesis?.cancel();
      mode = m;
      $('btnEnTh').classList.toggle('active', m === 'en-th');
      $('btnEnTh').classList.toggle('en', m === 'en-th');
      $('btnThEn').classList.toggle('active', m === 'th-en');
      $('btnThEn').classList.toggle('th', m === 'th-en');
      const enFirst = m === 'en-th';
      $('sourceLabel').textContent = enFirst ? '🇬🇧 English · you speak' : '🇹🇭 Thai · you speak';
      $('targetLabel').textContent = enFirst ? '🇹🇭 Thai · translation' : '🇬🇧 English · translation';
      sourceCard.classList.toggle('thai', !enFirst);
      targetCard.classList.toggle('thai', enFirst);
      micBtn.classList.toggle('th-mode', !enFirst);
      $('speakBtn').classList.toggle('th', !enFirst);
      sourceText.placeholder = enFirst ? 'Speak or type in English…' : 'พูดหรือพิมพ์ภาษาไทย…';
      targetText.placeholder = enFirst ? 'คำแปลภาษาไทยจะปรากฏที่นี่…' : 'English translation appears here…';
      micLabel.textContent = enFirst ? 'Tap to speak in English' : 'แตะเพื่อพูดภาษาไทย';
      sourceText.value = '';
      targetText.value = '';
      finalBuffer = '';
      lastTranslated = '';
      speakBtn.disabled = true;
      updateCounts();
      setStatus('', 'Ready — tap mic to speak');
    }

    function swapMode() {
      setMode(mode === 'en-th' ? 'th-en' : 'en-th');
    }

    function addHistory(orig, trans) {
      if (!orig || !trans) return;
      if (history[0] && history[0].o === orig && history[0].t === trans) return;
      history.unshift({ o: orig, t: trans, m: mode, ts: Date.now() });
      if (history.length > 40) history.length = 40;
      localStorage.setItem('te_history', JSON.stringify(history));
      renderHistory();
    }

    function renderHistory() {
      const list = $('historyList');
      if (!history.length) {
        list.innerHTML = '<div class="empty">No translations yet</div>';
        return;
      }
      list.innerHTML = history.map((h, i) =>
        '<div class="hist-item" onclick="loadHistory(' + i + ')">' +
        '<div class="h-orig">' + esc(h.o) + '</div>' +
        '<div class="h-trans">' + esc(h.t) + '</div></div>'
      ).join('');
    }

    function loadHistory(i) {
      const h = history[i];
      if (!h) return;
      if (h.m && h.m !== mode) setMode(h.m);
      sourceText.value = h.o;
      targetText.value = h.t;
      finalBuffer = h.o;
      lastTranslated = h.o;
      speakBtn.disabled = false;
      updateCounts();
    }

    function clearHistory() {
      history = [];
      localStorage.removeItem('te_history');
      renderHistory();
      toast('History cleared');
    }

    function setStatus(type, text) {
      statusDot.className = 'status-dot' + (type ? ' ' + type : '');
      statusText.textContent = text;
    }

    function updateCounts() {
      const s = sourceText.value.length;
      const t = targetText.value.length;
      $('sourceCount').textContent = s ? s + ' chars' : '';
      $('targetCount').textContent = t ? t + ' chars' : '';
    }

    function clearAll() {
      sourceText.value = '';
      targetText.value = '';
      finalBuffer = '';
      lastTranslated = '';
      speakBtn.disabled = true;
      updateCounts();
      window.speechSynthesis?.cancel();
    }

    function copyTarget() {
      const t = targetText.value;
      if (!t) return;
      navigator.clipboard.writeText(t).then(() => toast('Copied!')).catch(() => toast('Copy failed'));
    }

    function toast(msg) {
      const el = $('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.remove('show'), 2300);
    }

    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function toggleSettings() {
      const p = $('settingsPanel');
      const open = p.classList.toggle('open');
      $('settingsBtn').classList.toggle('active', open);
      if (open) populateVoices();
    }

    function toggleSetting(key) {
      settings[key] = !settings[key];
      const el = key === 'autoSpeak' ? $('toggleAutoSpeak') : $('toggleContinuous');
      el.classList.toggle('on', settings[key]);
      saveSettings();
    }

    function saveSettings() {
      localStorage.setItem('te_settings', JSON.stringify(settings));
    }

    function populateVoices() {
      const voices = getVoices();
      const enSel = $('voiceEn');
      const thSel = $('voiceTh');
      const enVoices = voices.filter(v => v.lang.toLowerCase().startsWith('en'));
      const thVoices = voices.filter(v => v.lang.toLowerCase().startsWith('th'));
      const fill = (sel, list, current) => {
        sel.innerHTML = '<option value="">Auto</option>' +
          list.map(v => '<option value="' + esc(v.name) + '"' + (v.name === current ? ' selected' : '') + '>' + esc(v.name) + ' (' + v.lang + ')</option>').join('');
      };
      fill(enSel, enVoices, settings.voiceEn);
      fill(thSel, thVoices, settings.voiceTh);
    }

    function syncSettingsUI() {
      $('toggleAutoSpeak').classList.toggle('on', settings.autoSpeak);
      $('toggleContinuous').classList.toggle('on', settings.continuous);
      $('rateSlider').value = settings.rate;
    }

    sourceText.addEventListener('input', () => {
      finalBuffer = sourceText.value;
      updateCounts();
    });
    sourceText.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        doTranslate();
      }
    });

    if (window.speechSynthesis) {
      getVoices();
      speechSynthesis.onvoiceschanged = () => {
        getVoices();
        if ($('settingsPanel').classList.contains('open')) populateVoices();
      };
    }

    $('rateSlider').addEventListener('change', saveSettings);
    $('voiceEn').addEventListener('change', saveSettings);
    $('voiceTh').addEventListener('change', saveSettings);

    initRecognition();
    syncSettingsUI();
    renderHistory();
    setMode('en-th');
    updateCounts();

    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && document.activeElement.tagName !== 'TEXTAREA' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'SELECT') {
        e.preventDefault();
        toggleMic();
      }
    });
  </script>
</body>
</html>

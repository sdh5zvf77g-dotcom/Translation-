<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Thai ↔ English Translator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b0f1a;
      --surface: #141b2d;
      --surface-2: #1c2538;
      --border: #2a3548;
      --text: #e8edf7;
      --text-muted: #8b9bb4;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --thai: #f97316;
      --en: #3b82f6;
      --radius: 16px;
      --shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', 'Noto Sans Thai', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Background gradient orbs */
    body::before {
      content: '';
      position: fixed;
      top: -20%;
      left: -10%;
      width: 50%;
      height: 50%;
      background: radial-gradient(circle, rgba(59,130,246,0.15) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -20%;
      right: -10%;
      width: 50%;
      height: 50%;
      background: radial-gradient(circle, rgba(249,115,22,0.12) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .app {
      position: relative;
      z-index: 1;
      max-width: 720px;
      margin: 0 auto;
      padding: 20px 16px 40px;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Header */
    header {
      text-align: center;
      padding: 12px 0 8px;
    }
    header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #60a5fa, #f97316);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    header p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 4px;
    }

    /* Mode switcher */
    .mode-switch {
      display: flex;
      background: var(--surface);
      border-radius: 14px;
      padding: 5px;
      border: 1px solid var(--border);
      gap: 4px;
    }
    .mode-btn {
      flex: 1;
      padding: 12px 8px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .mode-btn.active {
      background: var(--surface-2);
      color: var(--text);
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .mode-btn.active.en-th {
      background: linear-gradient(135deg, rgba(59,130,246,0.25), rgba(59,130,246,0.1));
      color: #93c5fd;
    }
    .mode-btn.active.th-en {
      background: linear-gradient(135deg, rgba(249,115,22,0.25), rgba(249,115,22,0.1));
      color: #fdba74;
    }
    .mode-btn:hover:not(.active) {
      color: var(--text);
      background: rgba(255,255,255,0.03);
    }
    .flag {
      font-size: 1.2rem;
    }

    /* Status bar */
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 10px 16px;
      background: var(--surface);
      border-radius: 12px;
      border: 1px solid var(--border);
      font-size: 0.875rem;
      color: var(--text-muted);
      min-height: 44px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
      transition: background 0.3s;
    }
    .status-dot.listening {
      background: var(--success);
      box-shadow: 0 0 10px var(--success);
      animation: pulse 1.2s infinite;
    }
    .status-dot.translating {
      background: var(--warning);
      animation: pulse 0.8s infinite;
    }
    .status-dot.speaking {
      background: var(--accent);
      animation: pulse 1s infinite;
    }
    .status-dot.error {
      background: var(--danger);
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.2); }
    }

    /* Text cards */
    .cards {
      display: flex;
      flex-direction: column;
      gap: 14px;
      flex: 1;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
      transition: border-color 0.2s;
    }
    .card:focus-within {
      border-color: var(--accent);
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .card-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .card-actions {
      display: flex;
      gap: 6px;
    }
    .icon-btn {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 8px;
      background: var(--surface-2);
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    .icon-btn:hover {
      background: var(--border);
      color: var(--text);
    }
    .icon-btn:active {
      transform: scale(0.92);
    }
    .card textarea {
      width: 100%;
      min-height: 90px;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: inherit;
      font-size: 1.15rem;
      line-height: 1.55;
      resize: none;
    }
    .card textarea::placeholder {
      color: var(--text-muted);
      opacity: 0.6;
    }
    .card.thai textarea {
      font-family: 'Noto Sans Thai', 'Inter', sans-serif;
      font-size: 1.25rem;
    }

    /* Mic control */
    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 8px 0 12px;
    }
    .mic-wrapper {
      position: relative;
      width: 96px;
      height: 96px;
    }
    .mic-btn {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(145deg, #3b82f6, #1d4ed8);
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 28px rgba(59,130,246,0.45);
      transition: all 0.25s ease;
      position: relative;
      z-index: 2;
    }
    .mic-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 32px rgba(59,130,246,0.55);
    }
    .mic-btn:active {
      transform: scale(0.97);
    }
    .mic-btn.listening {
      background: linear-gradient(145deg, #ef4444, #b91c1c);
      box-shadow: 0 8px 28px rgba(239,68,68,0.5);
      animation: mic-pulse 1.5s infinite;
    }
    .mic-btn.th-mode {
      background: linear-gradient(145deg, #f97316, #c2410c);
      box-shadow: 0 8px 28px rgba(249,115,22,0.45);
    }
    .mic-btn.th-mode.listening {
      background: linear-gradient(145deg, #ef4444, #b91c1c);
      box-shadow: 0 8px 28px rgba(239,68,68,0.5);
    }
    @keyframes mic-pulse {
      0% { box-shadow: 0 0 0 0 rgba(239,68,68,0.5); }
      70% { box-shadow: 0 0 0 22px rgba(239,68,68,0); }
      100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); }
    }
    .mic-rings {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .mic-rings span {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid rgba(239,68,68,0.4);
      opacity: 0;
    }
    .mic-btn.listening + .mic-rings span {
      animation: ring 1.5s infinite;
    }
    .mic-btn.listening + .mic-rings span:nth-child(2) {
      animation-delay: 0.4s;
    }
    @keyframes ring {
      0% { transform: scale(1); opacity: 0.6; }
      100% { transform: scale(1.7); opacity: 0; }
    }
    .mic-hint {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-align: center;
    }

    /* Bottom actions */
    .bottom-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .action-btn {
      padding: 11px 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s;
    }
    .action-btn:hover {
      background: var(--surface-2);
      border-color: #3a455c;
    }
    .action-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .action-btn.primary {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      border: none;
      color: white;
    }
    .action-btn.primary:hover {
      filter: brightness(1.08);
    }

    /* History */
    .history-section {
      margin-top: 8px;
    }
    .history-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .history-header h3 {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 220px;
      overflow-y: auto;
    }
    .history-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .history-item:hover {
      background: var(--surface-2);
    }
    .history-item .orig {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .history-item .trans {
      font-size: 1rem;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .empty-history {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      padding: 20px;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--surface-2);
      color: var(--text);
      padding: 12px 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
      font-size: 0.9rem;
      box-shadow: var(--shadow);
      z-index: 100;
      opacity: 0;
      transition: all 0.3s ease;
      pointer-events: none;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .app {
        padding: 16px 12px 32px;
      }
      header h1 {
        font-size: 1.4rem;
      }
      .mic-wrapper {
        width: 88px;
        height: 88px;
      }
      .mic-btn {
        width: 88px;
        height: 88px;
      }
      .card textarea {
        font-size: 1.05rem;
        min-height: 80px;
      }
      .card.thai textarea {
        font-size: 1.15rem;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Thai ↔ English</h1>
      <p>Speak naturally • Instant translation • Auto speak</p>
    </header>

    <!-- Mode switch -->
    <div class="mode-switch">
      <button class="mode-btn en-th active" id="modeEnTh" onclick="setMode('en-th')">
        <span class="flag">🇬🇧</span> English → Thai
      </button>
      <button class="mode-btn th-en" id="modeThEn" onclick="setMode('th-en')">
        <span class="flag">🇹🇭</span> Thai → English
      </button>
    </div>

    <!-- Status -->
    <div class="status-bar">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Ready — tap the mic to start</span>
    </div>

    <!-- Text cards -->
    <div class="cards">
      <div class="card" id="sourceCard">
        <div class="card-header">
          <span class="card-label" id="sourceLabel">
            <span>🇬🇧</span> English (you speak)
          </span>
          <div class="card-actions">
            <button class="icon-btn" title="Clear" onclick="clearSource()" aria-label="Clear">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
            </button>
          </div>
        </div>
        <textarea id="sourceText" placeholder="Speak or type here..." rows="3"></textarea>
      </div>

      <div class="card" id="targetCard">
        <div class="card-header">
          <span class="card-label" id="targetLabel">
            <span>🇹🇭</span> Thai (translation)
          </span>
          <div class="card-actions">
            <button class="icon-btn" title="Copy" onclick="copyTranslation()" aria-label="Copy">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
            </button>
            <button class="icon-btn" title="Speak" onclick="speakTranslation()" aria-label="Speak">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/></svg>
            </button>
          </div>
        </div>
        <textarea id="targetText" placeholder="Translation appears here..." rows="3" readonly></textarea>
      </div>
    </div>

    <!-- Mic -->
    <div class="controls">
      <div class="mic-wrapper">
        <button class="mic-btn" id="micBtn" onclick="toggleListening()" aria-label="Start listening">
          <svg id="micIcon" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/>
            <path d="M19 10v2a7 7 0 01-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
        </button>
        <div class="mic-rings">
          <span></span>
          <span></span>
        </div>
      </div>
      <p class="mic-hint" id="micHint">Tap to speak in English</p>
    </div>

    <!-- Extra actions -->
    <div class="bottom-actions">
      <button class="action-btn" onclick="translateTyped()" id="translateBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 8l6 6M4 14l6-6 2 2"/><path d="M12 20h9"/><path d="M16 4h4v4"/><path d="M14 10l6-6"/></svg>
        Translate text
      </button>
      <button class="action-btn primary" onclick="speakTranslation()" id="speakBtn" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/></svg>
        Speak
      </button>
    </div>

    <!-- History -->
    <div class="history-section">
      <div class="history-header">
        <h3>Recent</h3>
        <button class="icon-btn" title="Clear history" onclick="clearHistory()" style="width:28px;height:28px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
        </button>
      </div>
      <div class="history-list" id="historyList">
        <div class="empty-history">No translations yet</div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ========== State ==========
    let mode = 'en-th'; // 'en-th' | 'th-en'
    let isListening = false;
    let recognition = null;
    let lastFinalTranscript = '';
    let translateTimeout = null;
    let history = JSON.parse(localStorage.getItem('te_history') || '[]');
    let isSpeaking = false;

    const sourceText = document.getElementById('sourceText');
    const targetText = document.getElementById('targetText');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const micBtn = document.getElementById('micBtn');
    const micHint = document.getElementById('micHint');
    const speakBtn = document.getElementById('speakBtn');
    const sourceLabel = document.getElementById('sourceLabel');
    const targetLabel = document.getElementById('targetLabel');
    const sourceCard = document.getElementById('sourceCard');
    const targetCard = document.getElementById('targetCard');

    // ========== Init ==========
    function initSpeech() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        setStatus('error', 'Speech recognition not supported in this browser. Use Chrome or Edge.');
        micBtn.disabled = true;
        return;
      }
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        isListening = true;
        updateMicUI(true);
        setStatus('listening', mode === 'en-th' ? 'Listening (English)...' : 'กำลังฟัง (ภาษาไทย)...');
      };

      recognition.onresult = (event) => {
        let interim = '';
        let final = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const transcript = event.results[i][0].transcript;
          if (event.results[i].isFinal) {
            final += transcript;
          } else {
            interim += transcript;
          }
        }
        if (final) {
          lastFinalTranscript = (sourceText.value ? sourceText.value + ' ' : '') + final.trim();
          sourceText.value = lastFinalTranscript.trim();
          // Debounce translate for speed + less API calls
          clearTimeout(translateTimeout);
          translateTimeout = setTimeout(() => {
            translateAndSpeak(lastFinalTranscript.trim());
          }, 280);
        } else if (interim) {
          sourceText.value = (lastFinalTranscript ? lastFinalTranscript + ' ' : '') + interim;
        }
      };

      recognition.onerror = (event) => {
        console.warn('Speech error:', event.error);
        if (event.error === 'no-speech') {
          // keep listening
          return;
        }
        if (event.error === 'not-allowed') {
          setStatus('error', 'Microphone permission denied. Please allow mic access.');
          stopListening();
          return;
        }
        if (event.error === 'aborted') return;
        setStatus('error', 'Speech error: ' + event.error);
        stopListening();
      };

      recognition.onend = () => {
        if (isListening) {
          // Restart for continuous feel
          try {
            recognition.start();
          } catch (e) {
            isListening = false;
            updateMicUI(false);
            setStatus('ready', 'Ready — tap the mic to start');
          }
        } else {
          updateMicUI(false);
        }
      };
    }

    function setMode(newMode) {
      if (isListening) stopListening();
      mode = newMode;
      document.getElementById('modeEnTh').classList.toggle('active', mode === 'en-th');
      document.getElementById('modeThEn').classList.toggle('active', mode === 'th-en');
      document.getElementById('modeEnTh').classList.toggle('en-th', mode === 'en-th');
      document.getElementById('modeThEn').classList.toggle('th-en', mode === 'th-en');

      if (mode === 'en-th') {
        sourceLabel.innerHTML = '<span>🇬🇧</span> English (you speak)';
        targetLabel.innerHTML = '<span>🇹🇭</span> Thai (translation)';
        sourceCard.classList.remove('thai');
        targetCard.classList.add('thai');
        micBtn.classList.remove('th-mode');
        micHint.textContent = 'Tap to speak in English';
        sourceText.placeholder = 'Speak or type in English...';
        targetText.placeholder = 'คำแปลภาษาไทยจะปรากฏที่นี่...';
      } else {
        sourceLabel.innerHTML = '<span>🇹🇭</span> Thai (you speak)';
        targetLabel.innerHTML = '<span>🇬🇧</span> English (translation)';
        sourceCard.classList.add('thai');
        targetCard.classList.remove('thai');
        micBtn.classList.add('th-mode');
        micHint.textContent = 'แตะเพื่อพูดภาษาไทย';
        sourceText.placeholder = 'พูดหรือพิมพ์ภาษาไทย...';
        targetText.placeholder = 'English translation appears here...';
      }
      // Clear for clean switch
      sourceText.value = '';
      targetText.value = '';
      lastFinalTranscript = '';
      speakBtn.disabled = true;
      setStatus('ready', 'Ready — tap the mic to start');
    }

    function toggleListening() {
      if (isListening) {
        stopListening();
      } else {
        startListening();
      }
    }

    function startListening() {
      if (!recognition) {
        setStatus('error', 'Speech not available');
        return;
      }
      lastFinalTranscript = sourceText.value.trim();
      recognition.lang = mode === 'en-th' ? 'en-US' : 'th-TH';
      try {
        recognition.start();
      } catch (e) {
        console.error(e);
        setStatus('error', 'Could not start microphone');
      }
    }

    function stopListening() {
      isListening = false;
      if (recognition) {
        try { recognition.stop(); } catch (e) {}
      }
      updateMicUI(false);
      setStatus('ready', 'Ready — tap the mic to start');
    }

    function updateMicUI(listening) {
      micBtn.classList.toggle('listening', listening);
      if (listening) {
        micHint.textContent = mode === 'en-th' ? 'Listening... tap to stop' : 'กำลังฟัง... แตะเพื่อหยุด';
      } else {
        micHint.textContent = mode === 'en-th' ? 'Tap to speak in English' : 'แตะเพื่อพูดภาษาไทย';
      }
    }

    function setStatus(type, text) {
      statusDot.className = 'status-dot ' + (type === 'ready' ? '' : type);
      statusText.textContent = text;
    }

    // ========== Translation (fast free API) ==========
    async function translateText(text, from, to) {
      if (!text || !text.trim()) return '';
      const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text.trim())}&langpair=${from}|${to}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('Translation service error');
      const data = await res.json();
      if (data.responseStatus !== 200 && data.responseStatus !== '200') {
        // Fallback attempt with alternative free endpoint
        return await translateFallback(text, from, to);
      }
      return data.responseData.translatedText || '';
    }

    async function translateFallback(text, from, to) {
      // LibreTranslate public instance (may be rate-limited)
      try {
        const res = await fetch('https://libretranslate.com/translate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            q: text,
            source: from,
            target: to,
            format: 'text'
          })
        });
        if (!res.ok) throw new Error('fallback failed');
        const data = await res.json();
        return data.translatedText || text;
      } catch {
        return text; // last resort
      }
    }

    async function translateAndSpeak(text) {
      if (!text || !text.trim()) return;
      const from = mode === 'en-th' ? 'en' : 'th';
      const to = mode === 'en-th' ? 'th' : 'en';
      setStatus('translating', 'Translating...');
      try {
        const translated = await translateText(text, from, to);
        targetText.value = translated;
        speakBtn.disabled = !translated;
        addToHistory(text, translated);
        // Auto-speak the translation
        speakText(translated, to === 'th' ? 'th-TH' : 'en-US');
      } catch (err) {
        console.error(err);
        setStatus('error', 'Translation failed — try again');
        showToast('Translation error. Check connection.');
      }
    }

    async function translateTyped() {
      const text = sourceText.value.trim();
      if (!text) {
        showToast('Please enter some text first');
        return;
      }
      await translateAndSpeak(text);
    }

    // ========== Speech Synthesis ==========
    function speakText(text, lang) {
      if (!text || !window.speechSynthesis) return;
      // Cancel previous
      window.speechSynthesis.cancel();
      isSpeaking = true;
      setStatus('speaking', mode === 'en-th' ? 'Speaking Thai...' : 'Speaking English...');

      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = lang;
      utter.rate = 1.0;
      utter.pitch = 1.0;

      // Prefer a good voice if available
      const voices = window.speechSynthesis.getVoices();
      const preferred = voices.find(v => v.lang.startsWith(lang.split('-')[0]) && (v.name.includes('Google') || v.name.includes('Microsoft') || v.localService));
      if (preferred) utter.voice = preferred;
      else {
        const any = voices.find(v => v.lang.startsWith(lang.split('-')[0]));
        if (any) utter.voice = any;
      }

      utter.onend = () => {
        isSpeaking = false;
        if (isListening) {
          setStatus('listening', mode === 'en-th' ? 'Listening (English)...' : 'กำลังฟัง (ภาษาไทย)...');
        } else {
          setStatus('ready', 'Ready — tap the mic to start');
        }
      };
      utter.onerror = () => {
        isSpeaking = false;
        setStatus('ready', 'Ready — tap the mic to start');
      };

      window.speechSynthesis.speak(utter);
    }

    function speakTranslation() {
      const text = targetText.value.trim();
      if (!text) return;
      const lang = mode === 'en-th' ? 'th-TH' : 'en-US';
      speakText(text, lang);
    }

    // ========== History ==========
    function addToHistory(orig, trans) {
      if (!orig || !trans) return;
      // Avoid exact duplicates at top
      if (history[0] && history[0].orig === orig && history[0].trans === trans) return;
      history.unshift({ orig, trans, mode, time: Date.now() });
      if (history.length > 30) history.pop();
      localStorage.setItem('te_history', JSON.stringify(history));
      renderHistory();
    }

    function renderHistory() {
      const list = document.getElementById('historyList');
      if (!history.length) {
        list.innerHTML = '<div class="empty-history">No translations yet</div>';
        return;
      }
      list.innerHTML = history.map((item, i) => `
        <div class="history-item" onclick="loadHistory(${i})">
          <div class="orig">${escapeHtml(item.orig)}</div>
          <div class="trans">${escapeHtml(item.trans)}</div>
        </div>
      `).join('');
    }

    function loadHistory(index) {
      const item = history[index];
      if (!item) return;
      if (item.mode && item.mode !== mode) setMode(item.mode);
      sourceText.value = item.orig;
      targetText.value = item.trans;
      lastFinalTranscript = item.orig;
      speakBtn.disabled = false;
    }

    function clearHistory() {
      history = [];
      localStorage.removeItem('te_history');
      renderHistory();
      showToast('History cleared');
    }

    function clearSource() {
      sourceText.value = '';
      targetText.value = '';
      lastFinalTranscript = '';
      speakBtn.disabled = true;
    }

    function copyTranslation() {
      const text = targetText.value;
      if (!text) return;
      navigator.clipboard.writeText(text).then(() => {
        showToast('Copied to clipboard');
      }).catch(() => showToast('Could not copy'));
    }

    function escapeHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    // Load voices (Chrome loads them async)
    if (window.speechSynthesis) {
      window.speechSynthesis.getVoices();
      window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }

    // Init
    initSpeech();
    renderHistory();
    setMode('en-th');

    // Allow Enter to translate when typing
    sourceText.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        translateTyped();
      }
    });
  </script>
</body>
</html>
